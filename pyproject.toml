[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dicetables"
version = "5.0.0"
dependencies = []
requires-python = ">=3.10"
authors = [{ name = "Eric Shaw", email = "shaweric01@gmail.com" }]
maintainers = [{ name = "Eric Shaw", email = "shaweric01@gmail.com" }]
description = "get all combinations for any set of dice"
readme = "README.rst"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Games/Entertainment :: Role-Playing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://allthedice.com"
Documentation = "https://dice-tables.readthedocs.io/en/latest"
Repository = "https://github.com/eric-s-s/dice-tables.git"
Issues = "https://github.com/eric-s-s/dice-tables/issues"
Changelog = "https://github.com/eric-s-s/dice-tables/blob/master/CHANGELOG.md"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
  "PYI019", # `typing.Self` needs python 3.11. The minimum is 3.10.
  "TRY004", # the parser raises `ValueError` for bad values on purpose.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "PLR0124", # comparing an object with itself tests the comparison methods.
  "RUF012",  # test classes set `factory_keys` and `new_keys` as plain class attributes.
]
